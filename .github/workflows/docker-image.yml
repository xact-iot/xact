name: Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare Android signing key
        shell: bash
        env:
          XACT_ANDROID_KEYSTORE_BASE64: ${{ secrets.XACT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$XACT_ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set XACT_ANDROID_KEYSTORE_BASE64 and the Android signing password/alias secrets before publishing the mobile APK."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/xact-signing"
          printf '%s' "$XACT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xact-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/xact-signing/release.jks"

      - name: Build image from deploy artifacts
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          XACT_ANDROID_KEYSTORE: ${{ runner.temp }}/xact-signing/release.jks
          XACT_ANDROID_STORE_PASSWORD: ${{ secrets.XACT_ANDROID_STORE_PASSWORD }}
          XACT_ANDROID_KEY_ALIAS: ${{ secrets.XACT_ANDROID_KEY_ALIAS }}
          XACT_ANDROID_KEY_PASSWORD: ${{ secrets.XACT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "$TAGS" | head -n 1)"
          ./server/build_deploy.sh --docker --docker-image "$first_tag" --docker-platform linux/amd64
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ "$tag" != "$first_tag" ]; then
              docker tag "$first_tag" "$tag"
            fi
            docker push "$tag"
          done <<< "$TAGS"
