---
- name: Configure K3s node networking
  hosts: k3s_nodes
  become: true
  serial: 1

  tasks:
    - name: Skip when no Flannel interface is configured
      debug:
        msg: "k3s_flannel_iface is not set; no K3s network config changes needed."
      when: k3s_flannel_iface | default('') | length == 0

    - name: Ensure K3s config directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"
      when: k3s_flannel_iface | default('') | length > 0

    - name: Configure Flannel interface
      copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          flannel-iface: {{ k3s_flannel_iface }}
      register: k3s_network_config
      when: k3s_flannel_iface | default('') | length > 0

    - name: Restart K3s when network config changed
      systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      when:
        - k3s_flannel_iface | default('') | length > 0
        - k3s_network_config.changed

    - name: Wait for restarted node to report Ready
      command: >
        k3s kubectl wait node/{{ inventory_hostname }}
        --for=condition=Ready
        --timeout=180s
      register: node_ready
      changed_when: false
      when:
        - k3s_flannel_iface | default('') | length > 0
        - k3s_network_config.changed
