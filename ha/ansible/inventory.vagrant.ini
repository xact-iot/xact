[k3s_nodes]
# Local VMware/Vagrant lab inventory only. The password is acceptable for this
# disposable local lab, but production inventories should use SSH keys or a
# managed credential system.
node1 ansible_host=192.168.57.101
node2 ansible_host=192.168.57.102
node3 ansible_host=192.168.57.103

[k3s_master]
node1

[k3s_nodes:vars]
ansible_user=vagrant
ansible_password=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
k3s_flannel_iface=eth1
