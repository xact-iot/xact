---
- name: Fetch K3s kubeconfig
  hosts: k3s_master
  become: true
  vars:
    kubeconfig_dest: ../k3s/kubeconfig
    k3s_api_host: "{{ ansible_host }}"

  tasks:
    - name: Fetch kubeconfig from the first server
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_dest }}"
        flat: true

    - name: Point kubeconfig at the host-only cluster address
      become: false
      delegate_to: localhost
      replace:
        path: "{{ kubeconfig_dest }}"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ k3s_api_host }}:6443"
