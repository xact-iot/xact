[k3s_nodes]
# Replace these with your three Linux server addresses.
# ansible_user should be an SSH user with passwordless sudo, or you can run
# ansible-playbook with --ask-become-pass.
node1 ansible_host=10.0.0.11 ansible_user=ubuntu
node2 ansible_host=10.0.0.12 ansible_user=ubuntu
node3 ansible_host=10.0.0.13 ansible_user=ubuntu

[k3s_master]
# The first server bootstraps embedded etcd. The remaining k3s_nodes join it.
node1
