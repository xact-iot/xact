---
- name: Prepare Kubernetes nodes
  hosts: k3s_nodes
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - vim
          - net-tools
          - ca-certificates
          - gnupg
          - open-iscsi
          - nfs-common
        state: present

    - name: Disable swap immediately
      command: swapoff -a
      changed_when: false

    - name: Disable swap permanently
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure private node hostnames resolve locally
      lineinfile:
        path: /etc/hosts
        regexp: '.*\s{{ item }}$'
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
        state: present
      loop: "{{ groups['k3s_nodes'] }}"
