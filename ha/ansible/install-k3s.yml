---
- name: Install first K3s server
  hosts: k3s_master
  become: true
  vars:
    k3s_primary_ip: "{{ ansible_host }}"
    k3s_install_version_env: "{{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if (k3s_version | default('') | length > 0) else '' }}"
    k3s_common_server_args:
      - "--node-ip {{ k3s_primary_ip }}"
      - "--advertise-address {{ k3s_primary_ip }}"
      - "--write-kubeconfig-mode {{ k3s_write_kubeconfig_mode | default('644') }}"
    k3s_tls_san_args: "{{ (k3s_tls_sans | default([])) | map('regex_replace', '^(.*)$', '--tls-san \\1') | list }}"

  tasks:

    - name: Check if K3s is installed
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s cluster init server
      shell: |
        curl -sfL https://get.k3s.io | \
        {{ k3s_install_version_env }} \
        INSTALL_K3S_EXEC="server {{ (['--cluster-init'] + k3s_common_server_args + k3s_tls_san_args + (k3s_extra_server_args | default([]))) | join(' ') }}" \
        sh -
      when: not k3s_binary.stat.exists

    - name: Wait for token
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120


- name: Read K3s token
  hosts: k3s_master
  become: true

  tasks:

    - name: Get node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_file

    - name: Save token
      set_fact:
        k3s_token: "{{ token_file.content | b64decode | trim}}"


- name: Install remaining K3s servers
  hosts: k3s_nodes:!k3s_master
  become: true

  vars:
    master_name: "{{ groups['k3s_master'][0] }}"
    k3s_join_endpoint: "{{ k3s_api_endpoint | default(hostvars[master_name].ansible_host) }}"
    k3s_install_version_env: "{{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if (k3s_version | default('') | length > 0) else '' }}"
    k3s_common_server_args:
      - "--server https://{{ k3s_join_endpoint }}:6443"
      - "--node-ip {{ ansible_host }}"
      - "--advertise-address {{ ansible_host }}"
      - "--write-kubeconfig-mode {{ k3s_write_kubeconfig_mode | default('644') }}"
    k3s_tls_san_args: "{{ (k3s_tls_sans | default([])) | map('regex_replace', '^(.*)$', '--tls-san \\1') | list }}"

  tasks:

    - name: Wait for first server API
      wait_for:
        host: "{{ k3s_join_endpoint }}"
        port: 6443
        timeout: 120

    - name: Check if K3s exists
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Join K3s cluster
      shell: |
        curl -sfL https://get.k3s.io | \
        K3S_TOKEN="{{ hostvars[master_name]['k3s_token'] | trim }}" \
        {{ k3s_install_version_env }} \
        INSTALL_K3S_EXEC="server {{ (k3s_common_server_args + k3s_tls_san_args + (k3s_extra_server_args | default([]))) | join(' ') }}" \
        sh -
      when: not k3s_binary.stat.exists
