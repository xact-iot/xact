---
- name: Verify K3s cluster health
  hosts: k3s_master
  become: true

  tasks:
    - name: Check node readiness
      command: k3s kubectl get nodes -o wide
      register: k3s_nodes
      changed_when: false

    - name: Show node readiness
      debug:
        msg: "{{ k3s_nodes.stdout_lines }}"

    - name: Check system pods
      command: k3s kubectl get pods -A -o wide
      register: k3s_pods
      changed_when: false

    - name: Show system pods
      debug:
        msg: "{{ k3s_pods.stdout_lines }}"
